<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
        |
        <a th:href="@{/posts/new}">新規投稿</a>
    </nav>

    <article class="post">
        <header>
            <span class="post__avatar"
                  th:style="'--avatar-color: ' + ${post.avatarColor}"
                  aria-hidden="true"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
            <span class="post__created-at"
                  th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <nav class="post__tags" th:if="${!#sets.isEmpty(post.tags)}">
            <a th:each="tag : ${post.tags}"
               th:href="@{/tags/{name}(name=${tag.name})}"
               th:text="'#' + ${tag.name}">#tag</a>
        </nav>
        <footer>
            <span>いいね <span th:text="${likeCount}">0</span></span>
            <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                <button type="submit">Like</button>
            </form>
        </footer>
    </article>

    <section class="reply-form">
        <h2>リプライする</h2>
        <form th:action="@{/posts/{id}/replies(id=${post.id})}" th:object="${replyForm}" method="post">
            <div>
                <label for="reply-author">名前</label>
                <input type="text"
                       id="reply-author"
                       name="author"
                       th:value="${replyTargetId == post.id ? replyForm.author : ''}"
                       maxlength="30"
                       required>
                <p class="error"
                   th:if="${replyTargetId == post.id and #fields.hasErrors('author')}"
                   th:errors="*{author}">エラー</p>
            </div>
            <div>
                <label for="reply-body">本文</label>
                <textarea id="reply-body"
                          name="body"
                          th:text="${replyTargetId == post.id ? replyForm.body : ''}"
                          maxlength="280"
                          rows="3"
                          required></textarea>
                <p class="error"
                   th:if="${replyTargetId == post.id and #fields.hasErrors('body')}"
                   th:errors="*{body}">エラー</p>
            </div>
            <div>
                <label for="reply-avatarColor">アバター色</label>
                <input type="color"
                       id="reply-avatarColor"
                       name="avatarColor"
                       th:value="${replyTargetId == post.id ? replyForm.avatarColor : '#6b7280'}">
                <p class="error"
                   th:if="${replyTargetId == post.id and #fields.hasErrors('avatarColor')}"
                   th:errors="*{avatarColor}">エラー</p>
            </div>
            <button type="submit">返信</button>
        </form>
    </section>

    <section class="replies" th:if="${!#lists.isEmpty(replyTree)}">
        <h2>リプライ</h2>
        <ul class="reply-tree" th:insert="~{posts/replies :: replyNodes(${replyTree})}"></ul>
    </section>
</main>
</body>
</html>
